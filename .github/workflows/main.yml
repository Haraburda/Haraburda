name: Enterprise SIOP Pipeline CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Checkout Repository Source Code
      uses: actions/checkout@v4

    - name: 2. Configure Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 3. Install Data Engineering Dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install pandas numpy scikit-learn pytest

    - name: 4. Check File Structure Location
      run: |
        echo "=== Current Repository Layout ==="
        pwd
        ls -R

    - name: 5. Execute Code Pipeline Tests
      run: |
        # Forces python to natively read all directory layers 
        export PYTHONPATH=$GITHUB_WORKSPACE
        pytest -v --maxfail=1 --disable-warnings
