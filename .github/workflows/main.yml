name: Enterprise SIOP Pipeline CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Source Code
      uses: actions/checkout@v4

    - name: Configure Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Data Engineering Dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install pandas numpy scikit-learn pytest

    - name: Run Syntax Validation Check
      run: |
        # Fixed: Changed to a safe syntax layout check that won't panic on HTML assets
        python -m compileall -q ./demand_sensing

    - name: Execute Supply Chain Data Validation Tests via PyTest
      run: |
        # Fixed: Adds PYTHONPATH so the virtual environment natively tracks your project folders
        PYTHONPATH=. pytest --maxfail=1 --disable-warnings
