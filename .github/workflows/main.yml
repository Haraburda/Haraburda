name: Enterprise SIOP Pipeline CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Source Code
      uses: actions/checkout@v4

    - name: Configure Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        # Fixed: Removed the 'cache' line that was causing the error search crash

    - name: Install Data Engineering Dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install pandas numpy scikit-learn pytest

    - name: Run Syntax Validation Check
      run: |
        python -m compileall -q -x '\.git|\.github|\.pytest_cache' .

    - name: Execute Supply Chain Data Validation Tests via PyTest
      run: |
        pytest --maxfail=1 --disable-warnings --continue-on-collection-errors
